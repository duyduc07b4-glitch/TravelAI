<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Travel Companion — Local Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="topbar-shell">
    <div class="brand-block">
      <div class="brand-mark">O</div>
      <div>
        <h1>AI Travel Companion <span id="appSubtitle" data-i18n="appSubtitle"></span></h1>
      </div>
    </div>
    <div class="apikey-row">
      <span id="statusDot" class="status-dot status-off" title="Trạng thái kết nối AI"></span>
      <div class="lang-switch" role="group" aria-label="Language / 言語 / Ngôn ngữ">
        <button type="button" class="lang-btn" data-lang="vi">VI</button>
        <button type="button" class="lang-btn" data-lang="ja">JA</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
      <div class="user-info" id="user-info" style="display:none;">
        <span class="user-badge" id="user-name-badge"></span>
        <button type="button" class="secondary small" id="invites-btn">✉️ <span id="invites-count"></span></button>
        <button type="button" class="secondary small" id="logout-btn" data-i18n="auth.logoutBtn"></button>
      </div>
      <button type="button" class="secondary small" id="header-login-btn" data-i18n="auth.loginBtn"></button>
    </div>
  </div>
</header>

<!-- Màn đăng nhập — mở khi bấm "Đăng nhập" ở header, hoặc tự mở lại khi phiên hết hạn -->
<div class="login-overlay" id="login-overlay" style="display:none;">
  <div class="login-card">
    <button type="button" class="login-close" id="login-close" aria-label="Close">✕</button>
    <div class="login-brand">TravelAI</div>
    <p class="hint" data-i18n="auth.subtitle"></p>
    <div class="field"><label data-i18n="auth.usernameLabel"></label><input type="text" id="login-username" placeholder="admin1 / user1 / user2" autocomplete="username"></div>
    <div class="field"><label data-i18n="auth.passwordLabel"></label><input type="password" id="login-password" placeholder="123123" autocomplete="current-password"></div>
    <button type="button" id="login-submit" data-i18n="auth.loginBtn"></button>
    <div class="error-box" id="login-error" style="display:none;"></div>
    <p class="hint" data-i18n="auth.demoHint"></p>
  </div>
</div>

<!-- Bảng lời mời chuyến đi gửi tới người đang đăng nhập -->
<div class="login-overlay" id="invites-panel" style="display:none;">
  <div class="login-card invites-card">
    <div class="invites-head">
      <div class="login-brand" data-i18n="invite.panelTitle"></div>
      <button type="button" class="secondary small" id="invites-close" data-i18n="common.close"></button>
    </div>
    <div id="invites-panel-list"></div>
  </div>
</div>

<!-- Lịch sử lịch trình đã tạo, riêng cho từng tài khoản đăng nhập -->
<div class="login-overlay" id="history-panel" style="display:none;">
  <div class="login-card invites-card">
    <div class="invites-head">
      <div class="login-brand" data-i18n="history.panelTitle"></div>
      <button type="button" class="secondary small" id="history-close" data-i18n="common.close"></button>
    </div>
    <div id="history-panel-list"></div>
  </div>
</div>

<div class="hero-strip">
  <div class="hero-strip-track">
    <div class="hero-strip-card"><img src="assets/slide/american-village.jpg" alt=""><span class="hero-strip-caption">American Village</span></div>
    <div class="hero-strip-card"><img src="assets/slide/Cape_Manzamo.png" alt=""><span class="hero-strip-caption">Cape Manzamo</span></div>
    <div class="hero-strip-card"><img src="assets/slide/Churaumi.jpg" alt=""><span class="hero-strip-caption">Churaumi</span></div>
    <div class="hero-strip-card"><img src="assets/slide/kokusai-dori.jpg" alt=""><span class="hero-strip-caption">Kokusai Dori</span></div>
    <div class="hero-strip-card"><img src="assets/slide/kouri-island.jpeg" alt=""><span class="hero-strip-caption">Kouri Island</span></div>
    <div class="hero-strip-card"><img src="assets/slide/okinawa-world.png" alt=""><span class="hero-strip-caption">Okinawa World</span></div>
    <div class="hero-strip-card"><img src="assets/slide/SHURIJO.jpg" alt=""><span class="hero-strip-caption">Shurijo</span></div>
    <div class="hero-strip-card"><img src="assets/slide/Umikaji_Terrace.jpg" alt=""><span class="hero-strip-caption">Umikaji Terrace</span></div>
    <div class="hero-strip-card"><img src="assets/slide/american-village.jpg" alt=""><span class="hero-strip-caption">American Village</span></div>
    <div class="hero-strip-card"><img src="assets/slide/Cape_Manzamo.png" alt=""><span class="hero-strip-caption">Cape Manzamo</span></div>
    <div class="hero-strip-card"><img src="assets/slide/Churaumi.jpg" alt=""><span class="hero-strip-caption">Churaumi</span></div>
    <div class="hero-strip-card"><img src="assets/slide/kokusai-dori.jpg" alt=""><span class="hero-strip-caption">Kokusai Dori</span></div>
    <div class="hero-strip-card"><img src="assets/slide/kouri-island.jpeg" alt=""><span class="hero-strip-caption">Kouri Island</span></div>
    <div class="hero-strip-card"><img src="assets/slide/okinawa-world.png" alt=""><span class="hero-strip-caption">Okinawa World</span></div>
    <div class="hero-strip-card"><img src="assets/slide/SHURIJO.jpg" alt=""><span class="hero-strip-caption">Shurijo</span></div>
    <div class="hero-strip-card"><img src="assets/slide/Umikaji_Terrace.jpg" alt=""><span class="hero-strip-caption">Umikaji Terrace</span></div>
  </div>
</div>

<div style="max-width:1120px; margin:0 auto; padding:0 24px;">
  <div class="hint" id="loadProgress"></div>
</div>

<main>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="planner" data-i18n="tabs.planner"></button>
    <button class="tab-btn" data-tab="group" data-i18n="tabs.group"></button>
    <button class="tab-btn" data-tab="voice" data-i18n="tabs.voice"></button>
    <button class="tab-btn" data-tab="heal" data-i18n="tabs.heal"></button>
    <button class="tab-btn" data-tab="camera" data-i18n="tabs.camera"></button>
    <button class="tab-btn" data-tab="diff" data-i18n="tabs.diff"></button>
    <button class="tab-btn" data-tab="admin" data-i18n="admin.tabLabel" id="admin-tab-btn" style="display:none;"></button>
  </nav>

  <!-- TAB 1: Dynamic Trip Planning -->
  <section class="panel active" id="panel-planner">
    <div class="card">
      <h3 data-i18n="planner.title"></h3>
      <div class="row2">
        <div class="field"><label data-i18n="planner.destLabel"></label><input type="text" id="p-dest" placeholder="Okinawa"></div>
        <div class="field"><label data-i18n="planner.daysLabel"></label><input type="number" id="p-days" value="4" min="1" max="14"></div>
      </div>
      <div class="row2">
        <div class="field"><label data-i18n="planner.startDateLabel"></label><input type="date" id="p-start"></div>
        <div class="field"><label data-i18n="planner.budgetLabel"></label><input type="number" id="p-budget" data-i18n="planner.budgetPlaceholder" data-i18n-attr="placeholder" placeholder="80000"></div>
      </div>
      <div class="row2">
        <div class="field"><label data-i18n="planner.groupLabel"></label><input type="text" id="p-group" data-i18n="planner.groupPlaceholder" data-i18n-attr="placeholder"></div>
        <div class="field"><label data-i18n="planner.notesLabel"></label><input type="text" id="p-notes" data-i18n="planner.notesPlaceholder" data-i18n-attr="placeholder"></div>
      </div>
      <div class="field"><label data-i18n="group.membersLabel"></label>
        <div id="g-members"></div>
        <button type="button" class="secondary small" id="g-addMember" data-i18n="group.addMemberBtn"></button>
      </div>
      <div class="btn-row">
        <button id="p-run" data-i18n="planner.runBtn"></button>
        <button id="p-share" class="secondary" style="display:none;" data-i18n="planner.shareBtn"></button>
        <button id="p-history-btn" class="secondary" style="display:none;" data-i18n="history.openBtn"></button>
      </div>
      <div class="hint" id="p-shareFeedback"></div>
      <div class="group-decision" id="p-satisfaction"></div>
      <div id="p-costSummary"></div>
      <div class="result" id="p-result"></div>
      <div class="invite-box" id="p-invite" style="display:none;">
        <div class="invite-title" data-i18n="invite.sectionTitle"></div>
        <div class="invite-checklist" id="p-invite-list"></div>
        <button type="button" class="secondary small" id="p-invite-send" data-i18n="invite.sendBtn"></button>
        <div class="hint" id="p-invite-feedback"></div>
      </div>
    </div>
  </section>

  <!-- TAB 2: Group Matching -->
  <section class="panel" id="panel-group">
    <div class="card">
      <h3 data-i18n="group.title"></h3>
      <div class="field"><label data-i18n="group.placeLabel"></label><select id="g-place"></select></div>
      <div class="hint gate-hint" id="g-gateHint"></div>
      <div class="btn-row">
        <button id="g-run" data-i18n="group.runBtn"></button>
        <button type="button" class="secondary" id="g-swap" data-i18n="group.swapBtn"></button>
      </div>
      <div class="hint" id="g-ragHint"></div>
      <div class="group-decision" id="g-decision"></div>
      <div class="result" id="g-result"></div>
      <div class="chat-log" id="g-debate" style="margin-top:14px;"></div>
    </div>
  </section>

  <!-- TAB 3: Voice Assistant -->
  <section class="panel" id="panel-voice">
    <div class="card">
      <h3><span data-i18n="voice.title"></span> <span class="badge" id="voiceSupport"></span></h3>
      <div class="field">
        <label data-i18n="voice.voiceLabel"></label>
        <select id="v-voice" style="width:100%;"></select>
        <div class="hint" id="v-voiceHint"></div>
      </div>
      <div class="mic-area">
        <button class="mic-btn" id="v-mic">🎤</button>
        <div class="mic-hint" id="v-hint"></div>
      </div>
      <div class="field"><label data-i18n="voice.orTypeLabel"></label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="v-text" data-i18n="voice.textPlaceholder" data-i18n-attr="placeholder" style="flex:1;">
          <button id="v-send" class="secondary" data-i18n="voice.sendBtn"></button>
        </div>
      </div>
      <div class="chat-log" id="v-log"></div>
      <div id="v-checklist"></div>
      <div style="margin-top:14px;">
        <div class="btn-row">
          <button type="button" class="secondary" id="v-build" data-i18n="voice.buildBtn"></button>
          <button type="button" class="secondary" id="v-force-build" data-i18n="voice.forceBuildBtn" style="display:none;"></button>
        </div>
        <div class="hint" id="v-buildHint" data-i18n="voice.buildHint"></div>
      </div>
      <div class="result" id="v-itinResult"></div>
    </div>
  </section>

  <!-- TAB 4: Self-Healing Itinerary -->
  <section class="panel" id="panel-heal">
    <div class="card">
      <h3 data-i18n="heal.title"></h3>
      <div class="field"><label data-i18n="heal.itinLabel"></label>
        <textarea id="h-itin" data-i18n="heal.itinPlaceholder" data-i18n-attr="placeholder"></textarea>
        <div class="hint" id="h-itinHint" data-i18n="heal.itinFormatHint"></div>
      </div>
      <div class="row2">
        <div class="field"><label data-i18n="heal.destLabel"></label><input type="text" id="h-dest" placeholder="Okinawa"></div>
        <div class="field"><label data-i18n="heal.eventLabel"></label><input type="text" id="h-event" data-i18n="heal.eventPlaceholder" data-i18n-attr="placeholder"></div>
      </div>
      <button type="button" class="secondary small" id="h-weather" data-i18n="heal.weatherBtn"></button>
      <div class="hint" id="h-weatherStatus"></div>
      <div style="height:10px;"></div>
      <div class="btn-row">
        <button id="h-run" data-i18n="heal.runBtn"></button>
        <button type="button" class="secondary" id="h-accept" data-i18n="heal.acceptBtn" disabled></button>
      </div>
      <div class="hint" id="h-acceptStatus"></div>
      <div class="result" id="h-result"></div>
    </div>
  </section>

  <!-- TAB 5: Camera AI -->
  <section class="panel" id="panel-camera">
    <div class="card">
      <h3 data-i18n="camera.title"></h3>
      <div class="row2">
        <div class="field"><label data-i18n="camera.modeLabel"></label>
          <select id="c-mode">
            <option value="food" data-i18n="camera.modeFood"></option>
            <option value="landmark" data-i18n="camera.modeLandmark"></option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-top:12px;">
        <label data-i18n="camera.fileLabel"></label>
        <input type="file" id="c-file" accept="image/*" capture="environment">
      </div>
      <img id="c-preview" style="display:none; max-width:100%; border-radius:10px; margin:10px 0; border:1px solid var(--border);">
      <button id="c-run" disabled data-i18n="camera.runBtn"></button>
      <div class="result" id="c-result"></div>
    </div>
  </section>

  <!-- TAB 6: Differentiation (why TravelAI, not just another AI travel planner) -->
  <section class="panel" id="panel-diff">
    <div class="card">
      <h3 data-i18n="diff.title"></h3>
      <p class="hint" data-i18n="diff.subtitle" style="margin:-4px 0 16px;"></p>
      <div class="diff-cols">
        <div class="diff-col trad">
          <h5 data-i18n="diff.tradTitle"></h5>
          <ul id="diff-trad-list"></ul>
        </div>
        <div class="diff-col us">
          <h5 data-i18n="diff.usTitle"></h5>
          <ul id="diff-us-list"></ul>
        </div>
      </div>
      <div class="diff-example">
        <h5 data-i18n="diff.exampleTitle"></h5>
        <div class="diff-example-row old">
          <span class="diff-example-tag" data-i18n="diff.exampleOldTag"></span>
          <p data-i18n="diff.exampleOldText"></p>
        </div>
        <div class="diff-example-row new">
          <span class="diff-example-tag" data-i18n="diff.exampleNewTag"></span>
          <p data-i18n="diff.exampleNewText"></p>
        </div>
      </div>
      <p class="diff-mission" data-i18n="diff.mission"></p>
    </div>
  </section>

  <!-- TAB 7: Admin — chỉ hiện với tài khoản role "admin" -->
  <section class="panel" id="panel-admin">
    <div class="card">
      <h3 data-i18n="admin.title"></h3>
      <div id="admin-users-list"></div>
      <h4 class="admin-subheading" data-i18n="admin.addUserTitle"></h4>
      <div class="row2">
        <div class="field"><label data-i18n="admin.usernameLabel"></label><input type="text" id="admin-new-username"></div>
        <div class="field"><label data-i18n="admin.passwordLabel"></label><input type="text" id="admin-new-password"></div>
      </div>
      <div class="field"><label data-i18n="admin.roleLabel"></label>
        <select id="admin-new-role">
          <option value="user" data-i18n="admin.roleUser"></option>
          <option value="admin" data-i18n="admin.roleAdmin"></option>
        </select>
      </div>
      <button type="button" id="admin-add-user-btn" data-i18n="admin.addUserBtn"></button>
      <div class="hint" id="admin-feedback"></div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
